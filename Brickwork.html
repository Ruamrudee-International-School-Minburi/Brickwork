<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brickwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7FAFC; --booklet:#D7E4EE; --ink:#12212C; --muted:#56687A; --line:#BCCBD7; --wash:#EAF1F6;
  --red:#C91A09; --red-d:#9E1407; --yellow:#F2CD37; --blue:#0055BF; --green:#237841; --holo:#3DB6FF; --warn:#B8461B;
  --shadow:0 12px 34px rgba(9,28,44,.28);
  --font:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B2731; --booklet:#22323F; --ink:#E7EEF3; --muted:#9FB1BF; --line:#355063; --wash:#263846;
    --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B2731; --booklet:#22323F; --ink:#E7EEF3; --muted:#9FB1BF; --line:#355063; --wash:#263846;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--booklet);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--holo);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.5em .7em;user-select:text;-webkit-user-select:text}
input[type=range]{padding:0;accent-color:var(--red)}
h1,h2,h3,h4{margin:0;line-height:1.1;font-weight:760}

/* ------------- brick buttons: the signature element ------------- */
.brick{--b:var(--red);position:relative;display:inline-flex;align-items:center;gap:.6em;padding:.8em 1.15em .72em;margin-top:9px;
  background:var(--b);color:#fff;border:0;border-radius:5px;font-weight:720;font-size:1.06rem;line-height:1;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.18), 0 5px 12px rgba(0,0,0,.2);transition:transform .08s ease, filter .12s}
.brick::before{content:"";position:absolute;left:10px;right:10px;top:-8px;height:9px;pointer-events:none;
  background:radial-gradient(ellipse 9px 8px at 50% 100%, var(--b) 0 8px, transparent 8.6px) 0 0/30px 9px repeat-x;filter:brightness(1.08)}
.brick:hover{filter:brightness(1.07)}
.brick:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.2)}
.brick:disabled{filter:grayscale(.8) brightness(.9);cursor:not-allowed}
.brick.yellow{--b:var(--yellow);color:#2a2100}
.brick.blue{--b:var(--blue)}
.brick.green{--b:var(--green)}
.brick.gray{--b:#5F6B75}
.brick.small{font-size:.92rem;padding:.62em .9em .56em;margin-top:7px}
.brick.small::before{top:-6px;height:7px;background-size:22px 7px;background-image:radial-gradient(ellipse 7px 6px at 50% 100%, var(--b) 0 6px, transparent 6.6px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.5em .85em;border-radius:8px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-weight:640;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.32em .6em;font-size:.86rem;border-radius:7px}
.kbd{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:5px;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:760;font-size:.82rem}

/* ------------- main menu ------------- */
#menu{position:fixed;inset:0;display:flex;align-items:stretch;pointer-events:none}
#menu .col{pointer-events:auto;width:min(420px,92vw);padding:calc(28px + env(safe-area-inset-top,0px)) 34px calc(28px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:center;gap:6px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--booklet) 92%, transparent) 0%, color-mix(in srgb, var(--booklet) 70%, transparent) 70%, transparent 100%)}
#menu .logo{font-size:clamp(2.6rem,7vw,4rem);font-weight:800;letter-spacing:-.035em;line-height:.9;margin-bottom:.15em;font-variation-settings:"opsz" 96}
#menu .tag{color:var(--muted);margin:0 0 18px;max-width:30ch}
#menu .stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#menu .stack .brick{min-width:230px}
#menu .foot{margin-top:22px;color:var(--muted);font-size:.85rem}

/* ------------- HUD ------------- */
#hud{position:fixed;inset:0;pointer-events:none}
.hudbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:10px;background:color-mix(in srgb, var(--paper) 90%, transparent);
  border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;box-shadow:0 4px 14px rgba(0,0,0,.14);backdrop-filter:blur(6px)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #FFE680 0 30%, var(--yellow) 31% 62%, #C9A21D 63%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.coins{font-weight:780;font-size:1.05rem}
.lvl{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--blue);color:#fff;font-weight:800}
.xpbar{width:96px;height:7px;border-radius:5px;background:var(--wash);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--green);width:0%}
.clock{font-weight:720}
.muted{color:var(--muted)}
.small{font-size:.84rem}
#objective{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));pointer-events:none;
  background:color-mix(in srgb, var(--paper) 88%, transparent);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:640;
  max-width:min(560px,90vw);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#objective b{color:var(--red)}
#prompt{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:9px;
  background:color-mix(in srgb, var(--paper) 92%, transparent);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:680;
  box-shadow:var(--shadow);pointer-events:auto;cursor:pointer}
#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45);pointer-events:none}
#jobs{position:fixed;right:12px;top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
#jobs .job{pointer-events:auto;max-width:250px;background:color-mix(in srgb, var(--paper) 90%, transparent);border:1.5px solid var(--line);border-left:5px solid var(--blue);
  border-radius:9px;padding:6px 10px;font-size:.84rem;box-shadow:0 4px 12px rgba(0,0,0,.12)}
#jobs .job.late{border-left-color:var(--warn)}
#jobs .job.ready{border-left-color:var(--green)}
#waypoint{position:fixed;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top,0px));pointer-events:none;font-weight:700;
  background:var(--holo);color:#04263b;border-radius:999px;padding:4px 12px;font-size:.86rem}
#fps{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:.78rem;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:9px 14px;
  box-shadow:var(--shadow);font-weight:620;max-width:min(520px,92vw);animation:tin .25s ease-out}
.toast.good{border-left-color:var(--green)} .toast.warn{border-left-color:var(--warn)} .toast.gold{border-left-color:var(--yellow)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ------------- overlays / panels ------------- */
#overlay,#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,24,36,.42);backdrop-filter:blur(3px);z-index:40;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#modal{z-index:50}
.panel{background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);
  width:min(760px,96vw);max-height:min(86vh,860px);display:flex;flex-direction:column;overflow:hidden}
.panel.wide{width:min(1060px,97vw);height:min(760px,92vh)}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1.5px solid var(--line);background:var(--booklet)}
.phead h2{font-size:1.25rem}
.phead .sp{flex:1}
.pbody{padding:16px;overflow:auto;flex:1;min-height:0}
.pfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1.5px solid var(--line);flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.15rem;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,170px),1fr));gap:10px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);display:flex;flex-direction:column;gap:6px;position:relative}
.card.sel{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb, var(--red) 30%, transparent)}
.card .ic{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--wash);border-radius:8px}
.card h4{font-size:.98rem}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{font-weight:780;display:inline-flex;align-items:center;gap:5px}
.price::before{content:"";width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #FFE680 0 30%, var(--yellow) 31% 62%, #C9A21D 63%)}
.tag{display:inline-block;font-size:.74rem;font-weight:720;padding:2px 7px;border-radius:999px;background:var(--wash);color:var(--muted)}
.tag.red{background:color-mix(in srgb, var(--red) 15%, transparent);color:var(--red)}
.tag.blue{background:color-mix(in srgb, var(--blue) 15%, transparent);color:var(--blue)}
.tag.green{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green)}
.tag.gold{background:color-mix(in srgb, var(--yellow) 35%, transparent);color:#6b5200}
:root[data-theme="dark"] .tag.gold{color:var(--yellow)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.36em .85em;font-weight:660;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.38em .7em;font-weight:640;cursor:pointer;border-right:1.5px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid rgba(0,0,0,.18);cursor:pointer;position:relative;flex:none}
.sw.on{outline:3px solid var(--ink);outline-offset:1px}
.sw.trans{background-image:linear-gradient(135deg, rgba(255,255,255,.55) 0 30%, transparent 30% 60%, rgba(255,255,255,.4) 60%) !important}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.item .grow{flex:1;min-width:0}
.item .ic{width:64px;height:48px;object-fit:contain;background:var(--wash);border-radius:7px;flex:none}
.avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.reqs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.reqs li{display:flex;gap:7px;align-items:center;font-size:.9rem}
.reqs li::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--line);flex:none}
.reqs li.ok::before{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 2px var(--paper)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.stars{color:#E0A400;letter-spacing:1px;font-size:1.05rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:680}
.qty{display:inline-flex;gap:4px}
.hr{height:1.5px;background:var(--line);margin:12px 0}

/* computer OS */
.os{width:min(1100px,97vw);height:min(760px,92vh);border-radius:22px;padding:14px;background:#1d2228;box-shadow:var(--shadow);display:flex}
.os .screen{flex:1;display:grid;grid-template-columns:210px 1fr;border-radius:10px;overflow:hidden;background:var(--paper);min-width:0}
.os nav{background:var(--booklet);padding:14px 10px;display:flex;flex-direction:column;gap:4px;border-right:1.5px solid var(--line);overflow:auto}
.os nav .brand{font-weight:800;font-size:1.2rem;padding:2px 8px 10px;letter-spacing:-.02em}
.os nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:9px;padding:.55em .7em;font-weight:660;cursor:pointer}
.os nav button.on{background:var(--paper);box-shadow:0 1px 0 var(--line)}
.os nav .badge{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:800}
.os nav .off{margin-top:auto}
.os main{display:flex;flex-direction:column;min-width:0;min-height:0}
.os main .top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--line)}
.os main .top h2{font-size:1.3rem}
.os main .body{padding:16px 18px;overflow:auto;flex:1}
@media (max-width:720px){
  .os{padding:6px;border-radius:14px}
  .os .screen{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .os nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1.5px solid var(--line);padding:8px}
  .os nav .brand{display:none}
  .os nav .off{margin-top:0}
}

/* ------------- build mode ------------- */
#build{position:fixed;inset:0;pointer-events:none}
#build>*{pointer-events:auto}
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;max-width:98vw}
.palette{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;background:color-mix(in srgb, var(--paper) 92%, transparent);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;max-width:min(760px,96vw)}
.tools{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.hot{display:flex;gap:5px;background:color-mix(in srgb, var(--paper) 92%, transparent);border:1.5px solid var(--line);border-radius:14px;padding:6px}
.slot{width:58px;height:58px;border-radius:10px;border:2px solid var(--line);background:var(--wash);position:relative;cursor:pointer;display:grid;place-items:center;padding:0}
.slot img{width:52px;height:52px;object-fit:contain;pointer-events:none}
.slot.on{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb, var(--red) 35%, transparent)}
.slot .n{position:absolute;right:3px;bottom:1px;font-size:.72rem;font-weight:800;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper)}
.slot .k{position:absolute;left:4px;top:1px;font-size:.66rem;font-weight:800;color:var(--muted)}
.slot.zero{opacity:.45}
.tbtn{min-width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:720;font-size:.8rem;display:grid;place-items:center;padding:0 8px;line-height:1.05}
.tbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn small{display:block;font-size:.66rem;opacity:.7;font-weight:600}
.drawer{position:fixed;left:10px;top:calc(112px + env(safe-area-inset-top,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(300px,46vw);
  background:color-mix(in srgb, var(--paper) 95%, transparent);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.drawer .dh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.drawer .db{overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.drawer .cat{grid-column:1/-1;font-weight:760;font-size:.86rem;color:var(--muted);margin-top:4px}
.part{border:1.5px solid var(--line);border-radius:9px;background:var(--wash);cursor:pointer;padding:3px;position:relative;text-align:center}
.part img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}
.part .n{position:absolute;right:4px;top:2px;font-size:.7rem;font-weight:800}
.part .nm{font-size:.66rem;font-weight:640;line-height:1.1;display:block;min-height:2.2em}
.part.on{border-color:var(--red)}
.part.locked{opacity:.38}
.proj{position:fixed;right:10px;top:calc(62px + env(safe-area-inset-top,0px));width:min(330px,60vw);max-height:calc(100vh - 230px);overflow:auto;
  background:color-mix(in srgb, var(--paper) 95%, transparent);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px}
.proj h3{font-size:1.05rem;margin-bottom:4px}
.proj .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bhint{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:color-mix(in srgb, var(--paper) 92%, transparent);border:1.5px solid var(--line);
  border-radius:10px;padding:6px 12px;font-weight:640;font-size:.9rem;pointer-events:none;max-width:90vw;text-align:center}
.bhint.bad{border-color:var(--warn);color:var(--warn)}
.exitb{position:fixed;left:10px;top:calc(62px + env(safe-area-inset-top,0px))}

/* set booklet */
.stepbox{display:flex;align-items:center;gap:12px}
.stepno{width:62px;height:62px;border-radius:10px;background:var(--booklet);border:2px solid var(--ink);display:grid;place-items:center;font-size:1.9rem;font-weight:800;flex:none}
.prog{height:8px;border-radius:5px;background:var(--wash);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--holo)}
.booklet{width:100%;border-radius:10px;background:var(--booklet);margin-top:8px;aspect-ratio:4/3;object-fit:contain}
.tray{display:flex;gap:6px;background:color-mix(in srgb, var(--paper) 94%, transparent);border:1.5px solid var(--line);border-radius:14px;padding:6px;max-width:96vw;overflow-x:auto}
.tray .slot{width:66px;height:66px}
.tray .slot img{width:60px;height:60px}
.slot.need{animation:pulse .9s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,182,255,0)}50%{box-shadow:0 0 0 6px rgba(61,182,255,.75)}}

/* photo + tilt */
#tilt{position:fixed;inset:0;pointer-events:none}
#tilt::before,#tilt::after{content:"";position:absolute;left:0;right:0;height:34%;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#tilt::before{top:0;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
#tilt::after{bottom:0;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}

function analyze(bricks) {
  const st = { count: bricks.length, byType: {}, byColor: {}, groups: {}, trans: 0, cost: 0 };
  for (const b of bricks) {
    st.byType[b.t] = (st.byType[b.t] || 0) + 1;
    st.byColor[b.c] = (st.byColor[b.c] || 0) + 1;
    if (COLORS[b.c].trans) st.trans++;
    st.cost += partPrice(b.t, b.c);
  }
  for (const g in GROUPS) st.groups[g] = GROUPS[g].reduce((s, t) => s + (st.byType[t] || 0), 0);
  const bb = boundsOf(bricks);
  st.w = bb.w; st.d = bb.d; st.heightPlates = bb.h; st.heightBricks = Math.floor(bb.h / 3);
  st.colors = Object.keys(st.byColor).length;
  let dom = -1, domN = 0;
  for (const c in st.byColor) if (st.byColor[c] > domN) { domN = st.byColor[c]; dom = +c; }
  st.dominant = dom; st.dominantShare = st.count ? domN / st.count : 0;
  return st;
}

function reqLabel(q) {

    case 'bricks': return `At least ${q.n} pieces`;
    case 'height': return `${q.n} or more bricks tall`;
    case 'length': return `At least ${q.n} studs long`;
    case 'footprint': return `A base at least ${q.n}×${q.n} studs`;
    case 'colors': return `${q.n} or more different colors`;
    case 'color': return q.share >= 0.5 ? `Mostly ${cname(q.c)}` : `Some ${cname(q.c)} (${Math.round(q.share * 100)}% or more)`;
    case 'colorAny': return q.label || `Mostly ${q.cs.map(cname).join(' / ')}`;
    case 'group': { const w = GROUP_WORD[q.g][q.n === 1 ? 0 : 1]; return q.n === 1 ? `${/^[aeiou]/.test(w) ? 'An' : 'A'} ${w}` : `${q.n} ${w}`; }
    case 'trans': return 'A see-through piece';
    case 'any': return q.label || q.of.map(reqLabel).join(' or ');
  }

}
function reqMet(q, st) {
  switch (q.k) {
    case 'bricks': return st.count >= q.n;
    case 'height': return st.heightBricks >= q.n;
    case 'length': return Math.max(st.w, st.d) >= q.n;
    case 'footprint': return Math.min(st.w, st.d) >= q.n;
    case 'colors': return st.colors >= q.n;
    case 'color': return st.count > 0 && (st.byColor[q.c] || 0) / st.count >= q.share;
    case 'colorAny': return st.count > 0 && q.cs.reduce((s, c) => s + (st.byColor[c] || 0), 0) / st.count >= q.share;
    case 'group': return (st.groups[q.g] || 0) >= q.n;
    case 'trans': return st.trans >= (q.n || 1);

}

  const st = analyze(bricks);

  lines.push(`Size: ${st.w} studs wide (x), ${st.d} studs deep (z), ${st.heightBricks} bricks tall (${st.heightPlates} plates).`);
  lines.push(`Pieces: ${st.count}. Colors used: ` + Object.entries(st.byColor).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${COLORS[c].name} ×${n}`).join(', ') + '.');
  lines.push('Part types: ' + Object.entries(st.byType).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${TYPE[t].name} ×${n}`).join(', ') + '.');
  lines.push('Coordinates: x and z in studs, y in plates (3 plates = 1 brick), front of the model faces +z. Rotation r is in 90° steps. Slopes at r=0 face +z.');
  const bb = boundsOf(bricks);

/* ------------------------------------------------------- day / night */
function updateSky(tod, playerPos) {
  const f = tod / 1440;
  const elev = Math.sin((f - 0.25) * Math.PI * 2);
  const az = f * Math.PI * 2;
  const day = clamp(elev * 2.2 + 0.25, 0, 1);
  const dusk = clamp(1 - Math.abs(elev) * 4, 0, 1) * (elev > -0.25 ? 1 : 0);
  const top = new THREE.Color('#0B1628').lerp(new THREE.Color('#5E9BD6'), day);
  const bot = new THREE.Color('#1A2638').lerp(new THREE.Color('#DCEAF4'), day).lerp(new THREE.Color('#F2A66B'), dusk * 0.55);
  W.sky.material.uniforms.top.value.copy(top);
  W.sky.material.uniforms.bot.value.copy(bot);
  W.scene.fog.color.copy(bot).convertSRGBToLinear();
  W.sun.intensity = 1.55 * clamp(elev * 3, 0, 1);
  W.sun.color.setHSL(0.09, 0.6, 0.62 + 0.3 * day);
  W.hemi.intensity = 0.14 + 0.45 * day;
  W.amb.intensity = 0.08 + 0.06 * (1 - day);
  const p = playerPos || new THREE.Vector3();
  const sx = Math.cos(az + Math.PI / 2) * Math.cos(Math.max(0.12, elev)), sy = Math.max(0.12, elev), sz = 0.45;
  W.sun.position.set(p.x + sx * 60, sy * 60, p.z + sz * 60);
  W.sun.target.position.set(p.x, 0, p.z);
  W.stars.material.opacity = clamp((0.15 - elev) * 3, 0, 0.9);
  const night = clamp((0.1 - elev) * 4, 0, 1);
  W.lampMat.emissiveIntensity = night * 2.2;
  W.porchLight.intensity = night * 0.9;
  for (const m of W.winMats) m.emissiveIntensity = night * 0.65;
  if (W.monitor) W.monitor.material.emissiveIntensity = 0.75 + night * 0.4;
  W.night = night;
}

function keyDown(code) { return G.keys.has(code); }
function inZone(x, z) { for (const zn of W.zones) if (x > zn.x0 && x < zn.x1 && z > zn.z0 && z < zn.z1) return zn; return null; }
function resolve(x, z, r = 0.3) {
  const list = W.furnCols && W.furnCols.length ? W.colliders.concat(W.furnCols) : W.colliders;
  for (let pass = 0; pass < 2; pass++) for (const c of list) {
    if (x > c.x0 - r && x < c.x1 + r && z > c.z0 - r && z < c.z1 + r) {
      const dl = x - (c.x0 - r), dr = (c.x1 + r) - x, db = z - (c.z0 - r), df = (c.z1 + r) - z, m = Math.min(dl, dr, db, df);
      if (m === dl) x = c.x0 - r; else if (m === dr) x = c.x1 + r; else if (m === db) z = c.z0 - r; else z = c.z1 + r;
    }

}
function setCam() {
  const cam = W.camera;
  cam.rotation.order = 'YXZ';
  cam.position.set(PL.pos.x, EYE + Math.sin(PL.bob) * 0.025, PL.pos.z);

function walkTick(dt) {
  const k = SETTINGS.keys;
  let fx = 0, fz = 0;
  if (keyDown(k.fwd) || keyDown('ArrowUp')) fz += 1;
  if (keyDown(k.back) || keyDown('ArrowDown')) fz -= 1;
  if (keyDown(k.left) || keyDown('ArrowLeft')) fx -= 1;
  if (keyDown(k.right) || keyDown('ArrowRight')) fx += 1;
  fx += PL.tmove.x; fz += PL.tmove.y;
  const len = Math.hypot(fx, fz); if (len > 1) { fx /= len; fz /= len; }
  const run = keyDown(k.run) || keyDown('ShiftRight') || PL.run;
  const speed = run ? 5.8 : 3.3;
  const s = Math.sin(PL.yaw), c = Math.cos(PL.yaw);
  const tx = (-s * fz + c * fx) * speed, tz = (-c * fz - s * fx) * speed;
  const a = 1 - Math.exp(-dt * 12);
  PL.vel.x += (tx - PL.vel.x) * a; PL.vel.z += (tz - PL.vel.z) * a;
  let nx = PL.pos.x + PL.vel.x * dt, nz = PL.pos.z + PL.vel.z * dt;
  [nx, nz] = resolve(nx, nz);
  PL.pos.x = clamp(nx, -50, 54); PL.pos.z = clamp(nz, -16, 36);
  const sp = Math.hypot(PL.vel.x, PL.vel.z);
  if (sp > 0.4) { PL.bob += dt * sp * 2.2; PL.stepT += dt * sp; if (PL.stepT > 1.6) { PL.stepT = 0; AU.step(); } }
  setCam();
  // nearest interactable
  const fwdX = -s, fwdZ = -c;
  let best = null, bd = 9;
  for (const it of W.inter) {
    if (!it.show()) continue;
    const dx = it.x - PL.pos.x, dz = it.z - PL.pos.z, d = Math.hypot(dx, dz);
    if (d > it.r) continue;
    const dot = d > 0.01 ? (dx * fwdX + dz * fwdZ) / d : 1;
    if (dot < 0.15 && d > 0.9) continue;
    const score = d - dot * 0.6;
    if (score < bd) { bd = score; best = it; }
  }
  PL.near = best;
  const zn = inZone(PL.pos.x, PL.pos.z);
  if (zn !== PL.zone) {
    PL.zone = zn;
    if (zn) { W.IL.position.set((zn.x0 + zn.x1) / 2, zn.ly, (zn.z0 + zn.z1) / 2); W.IL.distance = Math.max(zn.x1 - zn.x0, zn.z1 - zn.z0) * 1.3; }
    if (zn && G.s && !G.s.visited[zn.id]) { G.s.visited[zn.id] = true; onVisit(zn.id); }
  }
  W.IL.intensity = PL.zone ? 1.05 : 0.0;
  if (FP.active) furnTick();
}
function interact() {
  if (G.mode !== 'walk' || !PL.near) return;
  AU.ui(); PL.near.act();
}
function lockPointer() {

/* ---------------------------------------------------------------- judge */
function judgePrompt(a, bricks, withImages) {
  return [
    `You are ${a.client}, a customer in a cozy brick-building game. You commissioned a custom model from a builder, and they are showing it to you now.`,
    `Your brief was: "${a.brief}"`,
    withImages ? 'Attached are renders of the model: a front-left view, a back-right view and a top-down view.' : 'You can’t see pictures, only the exact build data below. Picture the model from it.',
    'Build data:',
    describeBuild(bricks, 300),
    'Judge how well the model matches your brief, as the client. Be warm but honest: a model that ignores the brief scores low, one that nails it scores high. Small builds can still score well if they capture the idea.',
    'Reply with only a JSON object and nothing else:',
    '{"match": <integer 0-100>, "creativity": <integer 0-100>, "detail": <integer 0-100>, "verdict": "accept" or "revise", "feedback": "<2 or 3 sentences in first person that mention specific things in the model>", "met": ["<short item>"], "missing": ["<short item>"]}',
    'Use "accept" when match is 70 or more.',
  ].join('\n\n');
}
function cleanJudge(j) {
  const n = v => clamp(Math.round(+v || 0), 0, 100), arr = v => Array.isArray(v) ? v.slice(0, 6).map(x => String(x).slice(0, 90)) : [];
  const match = n(j && j.match);
  return { match, creativity: n(j && j.creativity), detail: n(j && j.detail), verdict: match >= 70 ? 'accept' : 'revise', feedback: String((j && j.feedback) || 'Thanks for showing me.').slice(0, 520), met: arr(j && j.met), missing: arr(j && j.missing) };
}
function ruleJudge(a, bricks) {
  const st = analyze(bricks), chk = checkReqs(a.fb, st);
  const match = clamp(Math.round(28 + chk.score * 64 + Math.min(6, st.count / 40)), 0, 100);
  const met = chk.rows.filter(r => r.ok).map(r => r.label), missing = chk.rows.filter(r => !r.ok).map(r => r.label);
  const feedback = missing.length
    ? `Thanks for this! I can see ${met.length ? met.slice(0, 2).join(' and ').toLowerCase() : 'a good start'}, but I was hoping for ${missing.slice(0, 2).join(' and ').toLowerCase()}.`
    : 'This has everything I asked for. Lovely work!';
  return { match, creativity: clamp(35 + st.colors * 6 + Object.keys(st.byType).length * 3, 0, 95), detail: clamp(Math.round(30 + st.count / 2), 0, 95), verdict: match >= 70 ? 'accept' : 'revise', feedback, met, missing };
}
const JUDGE_ERR = {
  not_granted: 'Claude wasn’t allowed to judge this time, so the built-in checker scored it.',
  rate_limited: 'The AI judge is busy right now, so the built-in checker scored it.',
  session_expired: 'Sign in to Claude again to use the AI judge. The built-in checker scored this one.',
  sampling_disabled: 'The AI judge isn’t available on this account, so the built-in checker scored it.',
};
async function runJudge(a, bricks) {
  let res = null, note = '';
  if (CAP.sample && !CAP.sampleOff) {
    try {
      const opts = { modelTier: 'default' };
      let imgs = [];
      if (CAP.images) {
        const views = [[1.1, 0.75, 1.3], [-1.2, 0.85, -1.1], [0.02, 1, 0.05]].slice(0, Math.max(1, Math.min(3, CAP.maxImages || 3)));
        imgs = await ICON.blobs(bricks, views, 640, 480);
        if (imgs.length) opts.images = imgs;
      }
      const j = await CAP.sample.json(judgePrompt(a, bricks, imgs.length > 0), opts);
      res = cleanJudge(j); res.source = 'ai';
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) CAP.sampleOff = true;
      if (code === 'images_unavailable') CAP.images = false;
      note = JUDGE_ERR[code] || 'Couldn’t reach the AI judge, so the built-in checker scored this.';
    }
  }
  if (!res) { res = ruleJudge(a, bricks); res.source = 'rules'; res.note = note; }
  return res;
}

/* --------------------------------------------------------------- ticks */
function careerTick(dt) {
  const s = G.s;
  s.playtime += dt; s.time += dt;
  incomeTick(dt);
  if (B.set && G.mode === 'build') s.project.time += dt;
  G._acc = (G._acc || 0) + dt;
  if (G._acc >= 1) { G._acc = 0; deliveriesTick(); ordersTick(); }
  G.autosaveT += dt;
  if (G.autosaveT > 90) { G.autosaveT = 0; saveGame(true); }
}

    const missing = needs.filter(a => !freeBoxFor(a.set)).map(a => {
      const s = SET[a.set];
      return `<div class="item"><img class="ic" src="${ICON.model('set:' + s.id, s.bricks, 160, 120)}" alt=""><div class="grow"><b>${esc(s.name)}</b><div class="small muted">${esc(a.client.split(' ')[0])} needs this built. Buy it ${esc(this.setBuyText(s))}.</div></div>${s.where !== 'store' ? `<button class="btn sm" data-a="buyForOrder" data-id="${a.id}">Order online</button>` : ''}</div>`;
    }).join('');
    this.modal(`${this.head('Set boxes').replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><div class="list">${rows || '<div class="empty">No boxes yet. Buy sets at Brickville Store or on your computer.</div>'}</div>${missing ? `<h4 style="margin:16px 0 8px">Sets you still need to buy</h4><div class="list">${missing}</div>` : ''}</div>`);
    this._modalKey = 'boxes';
  },
  orderClient(id) { const o = G.s.orders.active.find(q => q.id === id); return o ? o.client : 'a client'; },
  orderList() {
    const list = G.s.orders.active.filter(a => a.kind !== 'set').map(a => `<div class="item">${avatar(a.client, a.av)}<div class="grow"><b>${esc(a.title)}</b> ${KIND_TAG[a.kind]}<div class="small muted">${esc(a.brief)}</div></div>${a.status === 'building' ? `<button class="btn go sm" data-a="workOn" data-id="${a.id}">Work on it</button>` : '<span class="tag green">Ready to ship</span>'}</div>`).join('');
    this.modal(`${this.head('Your orders').replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><div class="list">${list || '<div class="empty">No custom orders yet. Accept one in the Orders app on your computer.</div>'}</div></div>`);
  },
  modelList(mode = 'load') {
    const ms = G.s.models.filter(m => !m.order);
    const list = ms.map(m => { const sk = shelfOf(m.id); return `<div class="item"><img class="ic" src="${modelIcon(m, 160, 120)}" alt=""><div class="grow"><b>${esc(m.name)}</b><div class="small muted">${m.bricks.length} pieces, worth ${fmt(m.value)}${sk ? `, on shelf ${sk[0] + 1}` : ''}</div></div><button class="btn sm go" data-a="loadModel" data-id="${m.id}">Put on the plate</button></div>`; }).join('');
    this.modal(`${this.head('Your models').replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><div class="list">${list || '<div class="empty">Store a build or finish a set to see it here.</div>'}</div></div>`);
  },
  shelfPick(id) {
    const m = modelById(id); if (!m) return;
    let html = '';
    G.s.shelves.forEach((sh, i) => {
      if (!sh.owned) return;
      html += `<div class="card"><h4>Shelf ${i + 1} ${sh.case ? '<span class="tag blue">Case</span>' : ''} ${sh.spot ? '<span class="tag gold">Spotlight</span>' : ''}</h4><div style="display:flex;gap:6px">` +
        sh.slots.map((sid, k) => { const om = sid && modelById(sid); return `<button class="slot" style="width:31%;height:auto;aspect-ratio:1" data-a="shelve" data-id="${id}" data-i="${i}" data-k="${k}" title="${om ? 'Swap out ' + esc(om.name) : 'Empty slot'}">${om ? `<img src="${modelIcon(om, 120, 90)}" alt="" style="width:100%;height:auto">` : '<span class="muted small">Empty</span>'}</button>`; }).join('') + '</div></div>';
    });
    const more = G.s.shelves.some(s => !s.owned) ? '<p class="small muted">Buy more wall shelves at the Furniture Store.</p>' : '';
    this.modal(`${this.head(`Put “${esc(m.name)}” on a shelf`).replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><div class="grid" style="--min:240px">${html}</div>${more}</div>`);
  },

  /* ---------------- computer ---------------- */
  computer(app) {
    if (app) this.st.os = app;
    if (this.st.os === 'orders') this.st.os = 'setorders';
    advanceTutIf(4, () => /orders$/.test(this.st.os));
    this.open('os', () => {
      const s = G.s, apps = [['setorders', 'Set orders', s.orders.offers.filter(x => x.kind === 'set').length], ['customorders', 'Custom orders', s.orders.offers.filter(x => x.kind !== 'set').length], ['bricks', 'Brick Shop'], ['sets', 'Set Store'], ['upgrades', 'Upgrades'], ['decor', 'Decor'], ['collection', 'Collection'], ['bank', 'Bank']];
      const nav = apps.map(([id, nm, badge]) => `<button class="${this.st.os === id ? 'on' : ''}" data-a="os" data-app="${id}">${nm}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`).join('');
      return `<div class="os"><div class="screen"><nav><div class="brand">BrickOS</div>${nav}<button class="off" data-a="close">Log off <span class="kbd">Esc</span></button></nav><main>${this['app_' + this.st.os]()}</main></div></div>`;
    });
  },
  top(title, extra = '') { return `<div class="top"><h2>${title}</h2><span style="flex:1"></span>${extra}<span class="chip" style="box-shadow:none"><span class="coin"></span><b>${fmt(G.s.coins)}</b></span></div>`; },
  app_orders() { return this.ordersApp('set'); },
  app_setorders() { return this.ordersApp('set'); },
  app_customorders() { return this.ordersApp('custom'); },
  setBuyText(s) {
    const st = s.where !== 'online', on = s.where !== 'store';
    return `${st ? `at Brickville Store for ${fmt(s.price)}` : ''}${st && on ? ', or ' : ''}${on ? `online for ${fmt(s.online)}` : ''}`;
  },
  ordersApp(group) {
    const o = G.s.orders, tab = this.st.ordersTab, inG = x => (group === 'set') === (x.kind === 'set');
    const offers = o.offers.filter(inG), active = o.active.filter(inG), hist = o.history.filter(inG);
    const tabs = `<div class="tabs">${[['available', `Available (${offers.length})`], ['active', `In progress (${active.length})`], ['history', 'History']].map(([id, nm]) => `<button class="${tab === id ? 'on' : ''}" data-a="otab" data-t="${id}">${nm}</button>`).join('')}</div>`;
    const intro = group === 'set' ? 'Clients pay you to buy a set and build it for them. The pay covers the set plus your time.' : 'Design something from a client’s brief with your own bricks. Clients pay you back for the parts you use.';
    let body = '';
    if (tab === 'available') {
      body = offers.map(f => {
        const s = f.kind === 'set' && SET[f.set];
        return `<div class="item" style="align-items:flex-start">${avatar(f.client, f.av)}<div class="grow"><div><b>${esc(f.title)}</b> ${KIND_TAG[f.kind]}</div><div class="small muted">${esc(f.client)}</div><p style="margin:6px 0">“${esc(f.brief)}”</p>
        ${f.reqs ? `<ul class="reqs">${f.reqs.map(q => `<li>${esc(reqLabel(q))}</li>`).join('')}</ul>` : ''}
        ${f.kind === 'premium' ? `<p class="small muted" style="margin:4px 0 0">${CAP.sample && !CAP.sampleOff ? 'Claude plays the client and scores how well your build matches the brief. Up to two revisions.' : 'Scored by the built-in checker. Up to two revisions.'}</p>` : ''}
        ${s ? `<p class="small muted" style="margin:4px 0 0">${s.pieces} pieces. You buy the set yourself, ${esc(this.setBuyText(s))}${freeBoxFor(s.id) ? '. You already have one' : ''}.</p>` : ''}
        <div class="small" style="margin-top:6px">Pays about ${coins(f.payEst)}${f.kind === 'premium' ? ', more for a great score' : ''}. Due ${fmtDur(f.dur)} after you accept. Offer ends in ${fmtDur(f.expires - G.s.time)}.</div></div>
        <button class="btn go" data-a="accept" data-id="${f.id}">Accept</button></div>`;
      }).join('') || `<div class="empty">New ${group === 'set' ? 'set' : 'custom'} orders arrive every few hours.</div>`;
    } else if (tab === 'active') {
      body = active.map(a => {
        const s = a.kind === 'set' && SET[a.set], has = s && freeBoxFor(a.set);
        const st = {
          needset: s ? (has ? `You have a ${esc(s.name)} box. Open it at your workbench and choose “Build for ${esc(a.client.split(' ')[0])}”.` : `Buy a ${esc(s.name)} box ${esc(this.setBuyText(s))}, then build it at your workbench.`) : '',
          waiting: 'The client’s box is on its way to your door.', porch: 'The box is at your front door. Bring it inside.',
          building: a.kind === 'set' ? 'The box is by your workbench. Build it there.' : 'Build it at your workbench.', ready: `Boxed and ready. Pays ${fmt(a.pay)}.`,
        }[a.status];
        return `<div class="item" style="align-items:flex-start">${avatar(a.client, a.av)}<div class="grow"><div><b>${esc(a.title)}</b> ${KIND_TAG[a.kind]} ${a.late ? '<span class="tag red">Late</span>' : ''} ${a.status === 'ready' ? `<span class="stars">${starStr(a.stars)}</span>` : ''}</div><div class="small muted">${esc(a.client)}${a.status !== 'ready' ? `, due in ${fmtDur(a.due - G.s.time)}` : ''}</div><p style="margin:6px 0">${st}</p></div>
          <div style="display:flex;flex-direction:column;gap:6px">${a.status === 'ready' ? `<button class="btn go" data-a="shipNow" data-id="${a.id}">Ship now (fee ${fmt(Math.round(a.pay * ECON.courierFee))})</button>` : ''}${a.status === 'needset' && !has && s && s.where !== 'store' ? `<button class="btn go" data-a="buyForOrder" data-id="${a.id}">Order the set (${fmt(s.online)})</button>` : ''}${a.status === 'building' && a.kind !== 'set' ? `<button class="btn go" data-a="workOn" data-id="${a.id}">Work on it</button>` : ''}${a.status !== 'ready' ? `<button class="btn sm ghost" data-a="cancelOrder" data-id="${a.id}">Cancel</button>` : ''}</div></div>`;
      }).join('') || '<div class="empty">Accept an offer to get started.</div>';
    } else {
      body = hist.map(h => `<div class="item"><div class="grow"><b>${esc(h.title)}</b> <span class="stars">${starStr(h.stars)}</span><div class="small muted">${esc(h.client)}: “${esc(h.review)}”</div></div>${coins(h.pay)}</div>`).join('') || '<div class="empty">Delivered orders show up here.</div>';
    }
    return this.top(group === 'set' ? 'Set orders' : 'Custom orders', `<span class="small muted">${o.active.length} of 3 order slots in use</span>`) + `<div class="body"><p class="small muted" style="margin-top:0">${intro}</p>${tabs}<div class="list">${body}</div></div>`;
  },
  brickShopHTML(where) {
    const cat = this.st.shopCat, t = this.st.shopT, tt = TYPE[t];
    if (!colorsFor(t).includes(this.st.shopC)) this.st.shopC = colorsFor(t)[0];
    const c = this.st.shopC;
    const unlockedCols = COLORS.filter(x => x.lvl <= G.s.level);
    const cats = `<div class="tabs">${CATS.map(k => `<button class="${cat === k ? 'on' : ''}" data-a="scat" data-c="${k}">${k}</button>`).join('')}</div>`;
    const parts = TYPES.filter(x => x.cat === cat).map(x => {
      const lock = x.lvl > G.s.level;
      return `<button class="part ${x.id === t ? 'on' : ''} ${lock ? 'locked' : ''}" data-a="stype" data-t="${x.id}" ${lock ? 'disabled' : ''}>${icon(x.id, c, 72)}<span class="n">${lock ? 'L' + x.lvl : ''}</span><span class="nm">${esc(x.name)}</span></button>`;
    }).join('');
    const sw = unlockedCols.map(x => `<button class="sw ${x.id === c ? 'on' : ''} ${x.trans ? 'trans' : ''}" style="background-color:${x.hex}" title="${esc(x.name)}" aria-label="${esc(x.name)}" data-a="scol" data-c="${x.id}"></button>`).join('');
    const own = invCount(t, c);
    const qty = [10, 25, 50].map(n => `<button class="btn ${n === 25 ? 'primary' : ''}" data-a="buyBricks" data-n="${n}" data-w="${where}">${n} for ${fmt(brickPrice(t, c, n, where))}</button>`).join('');
    return `<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:12px">
      <div class="card" style="flex-direction:row;gap:14px;align-items:center;flex-wrap:wrap"><img src="${ICON.part(t, c, 120)}" alt="" style="width:96px;height:96px;background:var(--wash);border-radius:10px">
        <div style="flex:1;min-width:200px"><h4 style="font-size:1.1rem">${esc(tt.name)}, ${esc(COLORS[c].name)}</h4><div class="small muted">You have ${own}. ${coins(Math.round(partPrice(t, c) * (where === 'online' ? ECON.onlineMarkup : ECON.pabDiscount) * 100) / 100)} each${where === 'online' ? ', delivered to your door' : ', yours right away'}.</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${sw}</div></div>
        <div class="qty" style="flex-wrap:wrap">${qty}</div></div>
      ${cats}<div class="grid" style="--min:92px">${parts}</div>
      <div class="item"><div class="grow"><b>Mixed bulk bin</b><div class="small muted">100 random bricks and plates in colors you’ve unlocked.</div></div><button class="btn" data-a="buyMix" data-w="${where}">Buy for ${fmt(where === 'online' ? 40 : 30)}</button></div></div>`;
  },
  app_bricks() { return this.top('Brick Shop', '<span class="small muted">Online prices are 25% higher than Brickville Store</span>') + `<div class="body">${this.brickShopHTML('online')}</div>`; },
  setCards(where) {
    return SETS.filter(s => where === 'online' ? true : s.where !== 'online').map(s => {
      const lock = s.lvl > G.s.level, price = where === 'online' ? s.online : s.price;
      const tag = s.where === 'online' ? '<span class="tag gold">Online only</span>' : s.where === 'store' ? '<span class="tag blue">Store only</span>' : '';
      const unavailable = where === 'online' && s.where === 'store';
      return `<div class="card"><img class="ic" src="${ICON.model('set:' + s.id, s.bricks, 240, 180)}" alt=""><h4>${esc(s.name)}</h4><div class="row"><span class="small muted">${esc(s.theme)}, ${s.pieces} pcs</span>${tag}</div>
        <div class="row">${unavailable ? '<span class="small muted">Only at Brickville Store</span>' : coins(price)}${lock ? `<span class="tag">Level ${s.lvl}</span>` : unavailable ? '' : `<button class="btn sm go" data-a="buySet" data-id="${s.id}" data-w="${where}">Buy</button>`}</div></div>`;
    }).join('');
  },
  app_sets() { return this.top('Set Store', '<span class="small muted">Delivered to your door</span>') + `<div class="body"><div class="grid" style="--min:190px">${this.setCards('online')}</div></div>`; },
  itemCards(list, where) {
    return list.map(it => {
      const lock = it.lvl > G.s.level, can = it.can(G.s);
      return `<div class="card"><h4>${esc(it.name)}</h4><div class="small muted">${esc(it.desc)}</div>${it.furn ? `<div class="small">You have ${furnOwned(it.furn)}</div>` : ''}<div class="row" style="margin-top:auto">${can ? coins(itemPrice(it, where)) : '<span class="tag green">Owned</span>'}${lock ? `<span class="tag">Level ${it.lvl}</span>` : can ? `<button class="btn sm go" data-a="buyItem" data-id="${it.id}" data-w="${where}">Buy</button>` : ''}</div></div>`;
    }).join('');
  },
  app_upgrades() { return this.top('Upgrades') + `<div class="body"><div class="grid" style="--min:210px">${this.itemCards(ITEMS.filter(i => i.cat === 'Workbench' || i.cat === 'Display'), 'online')}</div><p class="small muted">The Hobby Shop and Furniture Store sell these without the online markup.</p></div>`; },
  paintRow() {
    const o = G.s.owned;
    return `<div class="card"><h4>Your paints and floors</h4><div class="row" style="justify-content:flex-start;gap:6px">${o.paints.map(k => `<button class="btn sm ${o.wall === k ? 'primary' : ''}" data-a="paint" data-k="${k}">${PAINTS[k][0]} walls</button>`).join('')}</div><div class="row" style="justify-content:flex-start;gap:6px">${o.floors.map(k => `<button class="btn sm ${o.floor === k ? 'primary' : ''}" data-a="floor" data-k="${k}">${FLOORS[k][0]} floor</button>`).join('')}</div></div>`;
  },
  itemGroups(list, where) {
    return ['Furniture', 'Display', 'Decor', 'Paint and floors', 'Workbench'].map(c => { const l = list.filter(i => i.cat === c); return l.length ? `<h4 style="margin:16px 0 8px">${c}</h4><div class="grid" style="--min:200px">${this.itemCards(l, where)}</div>` : ''; }).join('');
  },
  app_decor() { return this.top('Decor', '<button class="btn sm" data-fa="open">Arrange furniture</button>') + `<div class="body">${this.paintRow()}<p class="small muted">Furniture is delivered to your door, then waits in storage until you place it.</p>${this.itemGroups(ITEMS.filter(i => i.cat === 'Furniture' || i.cat === 'Decor' || i.cat === 'Paint and floors' || i.id === 'shelf'), 'online')}</div>`; },
  app_collection() { return this.top('Collection') + `<div class="body">${this.collectionHTML()}</div>`; },
  collectionHTML() {
    const tab = this.st.coll, s = G.s;
    const tabs = `<div class="tabs">${[['models', 'Models'], ['boxes', 'Set boxes'], ['bricks', 'Bricks'], ['ach', 'Achievements'], ['stats', 'Stats']].map(([id, nm]) => `<button class="${tab === id ? 'on' : ''}" data-a="ctab" data-t="${id}">${nm}</button>`).join('')}</div>`;
    let body = '';
    if (tab === 'models') {
      body = `<div class="list">${s.models.map(m => {
        const sk = shelfOf(m.id), where = m.order ? 'Boxed for a client' : sk ? `On shelf ${sk[0] + 1}` : 'In storage';
        return `<div class="item"><img class="ic" src="${modelIcon(m, 160, 120)}" alt=""><div class="grow"><b>${esc(m.name)}</b> ${m.stars ? `<span class="stars">${starStr(m.stars)}</span>` : ''}<div class="small muted">${m.bricks.length} pieces, worth ${fmt(m.value)}. ${where}.</div></div>
          ${m.order ? '' : `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${sk ? `<button class="btn sm" data-a="unshelve" data-id="${m.id}">Take off shelf</button>` : `<button class="btn sm go" data-a="shelfPick" data-id="${m.id}">Put on shelf</button>`}<button class="btn sm" data-a="rename" data-id="${m.id}">Rename</button><button class="btn sm" data-a="exportModel" data-id="${m.id}">Export</button><button class="btn sm ghost" data-a="dismantle" data-id="${m.id}">Take apart</button></div>`}</div>`;
      }).join('') || '<div class="empty">No models yet. Finish a set, or store a build from your workbench.</div>'}</div><div class="acts" style="margin-top:10px"><button class="btn sm" data-a="importBuild">Import a build file</button></div>`;
    } else if (tab === 'boxes') {
      body = `<div class="grid" style="--min:180px">${s.boxes.map(bx => { const st = SET[bx.set]; return `<div class="card"><img class="ic" src="${ICON.model('set:' + st.id, st.bricks, 240, 180)}" alt=""><h4>${esc(st.name)}</h4><span class="small muted">${st.pieces} pieces${bx.order ? `, for ${esc(this.orderClient(bx.order))}` : ''}</span></div>`; }).join('') || '<div class="empty">No sealed boxes.</div>'}</div>`;
    } else if (tab === 'bricks') {
      const rows = Object.entries(s.inv).sort((a, b) => TYPE[a[0].split('|')[0]].i - TYPE[b[0].split('|')[0]].i || b[1] - a[1]);
      const total = rows.reduce((q, [, n]) => q + n, 0);
      body = `<p class="small muted" style="margin-top:0">${fmt(total)} loose pieces in your trays.</p><div class="grid" style="--min:96px">${rows.map(([k, n]) => { const [t, c] = k.split('|'); return `<div class="part" title="${esc(TYPE[t].name)}, ${esc(COLORS[c].name)}">${icon(t, +c, 72)}<span class="n">${n}</span><span class="nm">${esc(TYPE[t].name)}</span></div>`; }).join('')}</div>`;
    } else if (tab === 'ach') {
      body = `<div class="grid" style="--min:220px">${ACH.map(a => `<div class="card" style="${s.ach[a.id] != null ? '' : 'opacity:.5'}"><h4>${s.ach[a.id] != null ? '★ ' : ''}${esc(a.name)}</h4><span class="small muted">${esc(a.desc)}</span></div>`).join('')}</div>`;
    } else {
      const st = s.stats;
      body = `<dl class="kv"><dt>Bricks placed</dt><dd>${fmt(st.placed)}</dd><dt>Sets built</dt><dd>${fmt(st.sets)}</dd><dt>Orders delivered</dt><dd>${fmt(st.orders)}</dd><dt>Coins earned</dt><dd>${fmt(st.earned)}</dd><dt>Coins spent</dt><dd>${fmt(st.spent)}</dd><dt>Play time</dt><dd>${fmtPlay(s.playtime)}</dd><dt>Days in town</dt><dd>${Math.floor(s.time / 1440) + 1}</dd></dl>`;
    }
    return tabs + body;
  },
  app_bank() {
    const s = G.s, L = levelFromXp(s.xp);
    const rows = s.shelves.map((sh, i) => sh.owned ? `<div class="item"><div class="grow"><b>Shelf ${i + 1}</b> ${sh.case ? '<span class="tag blue">Case</span>' : ''} ${sh.spot ? '<span class="tag gold">Spotlight</span>' : ''}<div class="small muted">${sh.slots.filter(Boolean).length} of 3 slots filled, ${fmt([0, 1, 2].reduce((q, k) => q + slotRate(i, k) * 60, 0))} coins per hour</div></div>${coins(Math.floor(sh.pend.reduce((a, b) => a + b, 0)))}</div>` : '').join('');
    return this.top('Bank') + `<div class="body"><div class="grid" style="--min:200px"><div class="card"><span class="muted small">Coins</span><h3 style="font-size:1.8rem">${fmt(s.coins)}</h3></div><div class="card"><span class="muted small">Level ${L.level}</span><h3 style="font-size:1.8rem">${fmt(L.into)} / ${fmt(L.need)} XP</h3></div><div class="card"><span class="muted small">Display income</span><h3 style="font-size:1.8rem">${fmt(incomePerHour())} / h</h3><span class="small muted">One in-game hour is one real minute.</span></div></div>
      <div class="hr"></div><div class="row" style="display:flex;align-items:center;gap:10px"><b style="flex:1">${fmt(Math.floor(pendingTotal()))} coins waiting on your shelves</b><button class="btn go" data-a="collectAll">Collect it all</button></div>
      <p class="small muted">Each shelf slot fills up to 60% of its model’s value, then waits for you. Sets earn from their price; custom builds earn from the cost of their pieces.</p><div class="list">${rows}</div></div>`;
  },

  /* ---------------- town panels ---------------- */
  store(tab) {
    if (tab) this.st.storeTab = tab;
    this.open('store', () => {
      const t = this.st.storeTab;
      const tabs = `<div class="tabs"><button class="${t === 'sets' ? 'on' : ''}" data-a="stab" data-t="sets">Set aisles</button><button class="${t === 'pab' ? 'on' : ''}" data-a="stab" data-t="pab">Pick-a-Brick wall</button></div>`;
      const body = t === 'sets' ? `<p class="small muted" style="margin-top:0">In-store prices beat the online shop, and you carry the box home straight away.</p><div class="grid" style="--min:190px">${this.setCards('store')}</div>` : `<p class="small muted" style="margin-top:0">Fill a cup with exactly the pieces you want, 15% cheaper than list price.</p>${this.brickShopHTML('pab')}`;
      return `<div class="panel wide">${this.head('Brickville Store', `<span class="chip" style="box-shadow:none"><span class="coin"></span><b>${fmt(G.s.coins)}</b></span>`)}<div class="pbody">${tabs}${body}</div></div>`;

const MAP_PLACES = [['home', 0, 0, 'Home'], ['store', -13, 24, 'Brickville Store'], ['post', 3, 22.5, 'Post Office'], ['hobby', 16.5, 22, 'Hobby Shop'], ['furniture', 14, 1, 'Furniture Store'], ['cafe', -13.5, 1.5, 'Corner Café'], ['park', 35.5, -1, 'Park']];

function drawMap() {
  const cv = $('#mapcv'); if (!cv) return;

  x.fillStyle = '#7FAE62'; x.fillRect(0, 0, w, h);
  const rect = (x0, z0, x1, z1, col) => { const [a, b] = mapXY(x0, z0, cv), [c, d] = mapXY(x1, z1, cv); x.fillStyle = col; x.fillRect(a, b, c - a, d - b); };
  rect(-60, 9, 60, 15, '#4A4E55'); rect(-60, 7.3, 60, 9, '#C9C5BC'); rect(-60, 15, 60, 16.7, '#C9C5BC');
  rect(25, -9, 46, 7, '#94C477');
  rect(-5, -4, 5, 4, '#DDE5D4'); rect(-20, 18, -6, 30, '#D9473C'); rect(-2, 18, 8, 27, '#B4573F'); rect(12, 18, 21, 26, '#3E7D6B'); rect(9, -4, 19, 6, '#C7B79A'); rect(-18, -3, -9, 6, '#F0E1C8');
  x.font = '700 18px "Bricolage Grotesque", sans-serif'; x.textAlign = 'center';
  for (const [id, px, pz, nm] of MAP_PLACES) { const [a, b] = mapXY(px, pz, cv); x.fillStyle = 'rgba(255,255,255,.9)'; x.fillText(nm, a, b); if (G.s.waypoint === id) { x.strokeStyle = '#3DB6FF'; x.lineWidth = 5; x.beginPath(); x.arc(a, b - 6, 26, 0, 7); x.stroke(); } }
  const [px, py] = mapXY(PL.pos.x, PL.pos.z, cv);
  x.save(); x.translate(px, py); x.rotate(-PL.yaw); x.fillStyle = '#F2CD37'; x.strokeStyle = '#12212C'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(0, -14); x.lineTo(9, 10); x.lineTo(-9, 10); x.closePath(); x.fill(); x.stroke(); x.restore();

    const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * w, my = (e.clientY - r.top) / r.height * h;

    if (best) { G.s.waypoint = best[0]; toast(`Waypoint set: ${best[3]}.`, 'info'); UI.refresh(); drawMap(); }
  };
}

function thumbShot() {

function migrate(s) {
  if (!s.furn) {
    const dec = (s.owned && s.owned.decor) || {}, placed = [];
    if (dec.couch !== false) placed.push({ id: uid(), k: 'sofa', x: -2.3, z: 3.44, r: 2 });
    if (dec.rug) placed.push({ id: uid(), k: 'rug', x: 0, z: 1.1, r: 0 });
    if (dec.plant) placed.push({ id: uid(), k: 'plant', x: -4.5, z: -1.7, r: 0 });
    s.furn = { inv: {}, placed };
  }
  if (s.owned && s.owned.decor) { delete s.owned.decor.couch; delete s.owned.decor.rug; delete s.owned.decor.plant; }
  const d = newCareer(s.name);
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  s.owned = { ...d.owned, ...s.owned, decor: { ...d.owned.decor, ...(s.owned && s.owned.decor) } };
  s.orders = { ...d.orders, ...s.orders };
  s.stats = { ...d.stats, ...s.stats };
  if (!Array.isArray(s.shelves) || s.shelves.length !== 6) s.shelves = d.shelves;
  s.models = (s.models || []).map(m => ({ ...m, bricks: Array.isArray(m.bricks[0]) ? expandBricks(m.bricks) : m.bricks }));
  s.plateBricks = Array.isArray(s.plate) && Array.isArray(s.plate[0]) ? expandBricks(s.plate) : (s.plate || []);
  s.level = levelFromXp(s.xp).level;

}

  PL.pos.set(s.player.x, 0, s.player.z); PL.yaw = s.player.yaw; PL.pitch = -0.05; PL.vel.set(0, 0, 0); PL.zone = null;

/* ------------------------------------------------------- export/import */
async function exportBricks(name, bricks) {
  if (!bricks.length) { toast('There’s nothing to export yet.', 'warn'); return; }
  const json = JSON.stringify({ format: 'brickwork-build', v: 1, name, bricks: compactBricks(normalizeBricks(bricks)) });
  const file = (name || 'build').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.brickwork.json';
  if (CAP.downloads) {
    try { await CAP.downloads.save({ filename: file, data: json }); toast('Build file saved.', 'good'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  UI.modal(`${UI.head('Copy your build code').replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><p class="small muted" style="margin-top:0">Copy this text and keep it somewhere safe. Paste it into Import to bring the build back.</p><textarea readonly style="width:100%;height:180px">${esc(json)}</textarea></div>`);
}
function importDialog() {
  UI.modal(`${UI.head('Import a build').replace('data-a="close"', 'data-a="closeModal"')}<div class="pbody"><p class="small muted" style="margin-top:0">Choose a .brickwork.json file, or paste build code.</p><input type="file" id="impFile" accept=".json,application/json"><textarea id="impText" placeholder="Paste build code here" style="width:100%;height:120px;margin-top:10px"></textarea>
    <p class="small muted">${G.s ? 'In your career, an imported build goes onto your baseplate using bricks from your trays, so you need every piece.' : 'It goes straight onto your baseplate.'}</p></div><div class="pfoot"><button class="btn" data-a="closeModal">Cancel</button><button class="btn go" data-a="doImport">Import</button></div>`);
  const f = $('#impFile');
  if (f) f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { $('#impText').value = r.result; }; r.readAsText(file); };
}
function doImport() {
  let data;
  try { data = JSON.parse($('#impText').value); } catch (e) { toast('That doesn’t look like build code.', 'warn'); return; }
  if (!data || data.format !== 'brickwork-build' || !Array.isArray(data.bricks)) { toast('That doesn’t look like a Brickwork build.', 'warn'); return; }
  const bricks = expandBricks(data.bricks);
  if (!bricks.length) { toast('That build is empty.', 'warn'); return; }
  if (B.set) { toast('Finish or pause your set first.', 'warn'); return; }
  if (B.grid.bricks.size) { toast('Clear or store the current plate first.', 'warn'); return; }
  const bb = boundsOf(bricks);
  if (bb.w > B.W || bb.d > B.D) { toast(`This build needs a ${Math.max(bb.w, bb.d)}-stud baseplate.`, 'warn'); return; }
  if (G.s) {
    const need = {}; for (const b of bricks) { const k = ikey(b.t, b.c); need[k] = (need[k] || 0) + 1; }
    const short = Object.entries(need).filter(([k, n]) => (G.s.inv[k] || 0) < n);
    if (short.length) { const [k, n] = short[0], [t, c] = k.split('|'); toast(`You’re short on parts, for example ${n - (G.s.inv[k] || 0)} × ${TYPE[t].name} in ${COLORS[c].name}.`, 'warn'); return; }
  }
  const ox = Math.floor((B.W - bb.w) / 2) - bb.x0, oz = Math.floor((B.D - bb.d) / 2) - bb.z0;
  const shifted = bricks.map(b => ({ ...b, x: b.x + ox, z: b.z + oz }));
  loadPlate(shifted);
  for (const b of shifted) invAdd(b.t, b.c, -1);
  UI.closeModal(); AU.rattle(); onPlateChange();
  toast(`Imported “${data.name || 'build'}”.`, 'good');
  if (G.mode !== 'build' && G.s) toast('It’s waiting on your workbench.', 'info');
}

/* -------------------------------------------------------------- keys */
const NUMS = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9'];
window.addEventListener('keydown', e => {
  AU.init();
  if (UI._rebind) {
    e.preventDefault();
    if (e.code !== 'Escape') { SETTINGS.keys[UI._rebind] = e.code; saveSettings(); }
    UI._rebind = null; UI.settings(); return;
  }
  const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
  if (typing) { if (e.code === 'Enter' && $('#askIn') === e.target) ACT.askOk(); if (e.code === 'Escape') UI.closeModal(); return; }
  G.keys.add(e.code);
  const k = SETTINGS.keys;
  if (e.code === 'Escape') {
    if (!$('#modal').hidden) { if (UI._modalKey === 'settings') ACT.settingsDone(); else if (G.mode === 'pause') UI.resume(); else UI.closeModal(); return; }
    if (G.mode === 'ui') { UI.closeAll(); return; }
    if (G.mode === 'build') { if (G.photo) togglePhoto(); else exitBuild(); return; }
    if (G.mode === 'walk') { if (performance.now() - (PL.lockLostAt || 0) < 300) return; if (FP.active) furnCancel(); else UI.pause(); return; }
    return;
  }
  if (!$('#modal').hidden) return;
  if (G.mode === 'walk') {
    if (FP.active) { if (e.code === 'KeyR') furnRotate(); else if (e.code === k.use || e.code === 'Enter') furnConfirm(); else if (e.code === 'KeyQ') furnCancel(); else if (e.code === 'KeyX') furnStore(); return; }
    if (e.code === 'KeyF' && G.s && k.use !== 'KeyF') UI.furnPanel();
    else if (e.code === k.use) interact();
    else if (e.code === k.phone && G.s) UI.phone();
    else if (e.code === k.inv && G.s) UI.inventory();
  } else if (G.mode === 'ui') {
    if ((e.code === k.phone && UI.cur && UI.cur.name === 'phone') || (e.code === k.inv && UI.cur && UI.cur.name === 'inv')) UI.closeAll();
  } else if (G.mode === 'build' && !G.photo) {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (ctrl && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
    if (ctrl) return;
    const ni = NUMS.indexOf(e.code);
    if (ni >= 0 && !B.set) { ACT.hot({ i: ni }); return; }
    if (e.code === 'KeyR') rotateHeld(e.shiftKey ? -1 : 1);
    else if (e.code === 'KeyB') setTool('place'); else if (e.code === 'KeyX' || e.code === 'Delete') setTool('remove');
    else if (e.code === 'KeyV') setTool('paint'); else if (e.code === 'KeyF') setTool('pick'); else if (e.code === 'KeyG') setTool('move');
    else if (e.code === 'KeyN' && (G.sandbox || (G.s && G.s.owned.mirror))) ACT.mirror();
    else if (e.code === 'Tab') { e.preventDefault(); if (!B.set) ACT.drawer(); }
    else if (e.code === 'KeyP') togglePhoto();

/* ----------------------------------------------------------- pointer */
canvas.addEventListener('contextmenu', e => e.preventDefault());

});
function endPtr(e) {

  const p = B.ptrs.get(e.pointerId); B.ptrs.delete(e.pointerId); B._pinch = null;
  if (G.mode !== 'build' || !p || G.photo) return;

}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('pointerleave', () => { if (G.mode === 'build' && !B.ptrs.size && !B.dragTray) { B.mouse.in = false; hideGhost(); clearSel(); } });
canvas.addEventListener('wheel', e => { if (G.mode !== 'build') return; e.preventDefault(); B.orbit.r = clamp(B.orbit.r * Math.exp(e.deltaY * 0.0012), 0.12, 1.5); B.mouse.dirty = true; }, { passive: false });

document.addEventListener('pointerdown', e => {
  const tr = e.target.closest && e.target.closest('[data-tray]'); if (!tr || !B.set) return;

document.addEventListener('pointermove', e => { if (!B.dragTray) return; B.mouse = { x: e.clientX, y: e.clientY, in: document.elementFromPoint(e.clientX, e.clientY) === canvas, dirty: true }; });

// touch walk controls
(() => {
  const st = $('#tStick'), kn = $('#tKnob'); let id = null, cx = 0, cy = 0;
  st.addEventListener('pointerdown', e => { e.preventDefault(); id = e.pointerId; const r = st.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; st.setPointerCapture(id); });
  st.addEventListener('pointermove', e => { if (e.pointerId !== id) return; let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), m = 46; if (d > m) { dx *= m / d; dy *= m / d; } kn.style.transform = `translate(${dx}px,${dy}px)`; PL.tmove.x = dx / m; PL.tmove.y = -dy / m; });
  const end = e => { if (e.pointerId !== id) return; id = null; kn.style.transform = ''; PL.tmove.x = PL.tmove.y = 0; };

  $('#tRun').addEventListener('pointerdown', e => { e.preventDefault(); PL.run = !PL.run; $('#tRun').style.background = PL.run ? 'rgba(201,26,9,.6)' : ''; });

window.addEventListener('resize', () => {
  applyQuality();
  if (W.camera) { W.camera.aspect = innerWidth / innerHeight; W.camera.updateProjectionMatrix(); }
  if (G.menuCam) { G.menuCam.aspect = innerWidth / innerHeight; G.menuCam.updateProjectionMatrix(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.s && G.dirty) saveGame(true); });
window.addEventListener('pagehide', () => { if (G.s && G.dirty) saveGame(true); });

/* ------------------------------------------------------- house hooks */
function setupHouseInter() {
  inter('bench', W.desk.x, W.desk.z + 0.95, 1.5, () => G.s && G.s.project && G.s.project.kind === 'set' ? 'Continue building your set' : 'Use the workbench', () => enterBuild());
  inter('pc', 2.6, -2.55, 1.35, () => G.s && G.s.orders.offers.length ? `Use the computer (${G.s.orders.offers.length} new orders)` : 'Use the computer', () => UI.computer());
  for (const col of [0, 2, 4]) {
    const a = W.shelfAnchors[col];
    inter('shelf' + col, a.x + (a.dir < 0 ? -0.85 : 0.85), a.z, 1.25, () => 'Look at your shelves', () => UI.shelf(col), () => G.s && (G.s.shelves[col].owned || G.s.shelves[col + 1].owned));
  }
  inter('porch', 1.0, 4.95, 1.7, () => `Bring ${G.s.porch.length} package${G.s.porch.length > 1 ? 's' : ''} inside`, () => collectPorch(), () => G.s && G.s.porch.length > 0);
}
UI.shelf = function (col) {
  this.open('shelf', () => {
    const units = [col, col + 1].filter(j => G.s.shelves[j].owned);
    const sec = units.map(i => {
      const sh = G.s.shelves[i];
      const cards = sh.slots.map((id, k) => {
        const m = id && modelById(id);
        if (!m) return `<div class="card"><div class="empty">Empty slot</div><button class="btn go sm" data-a="pickFor" data-i="${i}" data-k="${k}">Put a model here</button></div>`;
        return `<div class="card"><img class="ic" src="${modelIcon(m, 200, 150)}" alt=""><h4>${esc(m.name)}</h4><div class="small muted">${fmt(slotRate(i, k) * 60)} coins per hour, ${fmt(Math.floor(sh.pend[k]))} of ${fmt(slotCap(i, k))} waiting</div><div class="row"><button class="btn sm go" data-a="collectSlot" data-i="${i}" data-k="${k}">Collect</button><button class="btn sm" data-a="unshelve" data-id="${m.id}">Take down</button></div></div>`;
      }).join('');
      return `<h3 style="margin:4px 0 8px">Shelf ${i + 1} ${sh.case ? '<span class="tag blue">Display case +50%</span>' : ''} ${sh.spot ? '<span class="tag gold">Spotlight +25%</span>' : ''}</h3><div class="grid" style="--min:190px;margin-bottom:14px">${cards}</div>`;
    }).join('');
    return `<div class="panel wide">${this.head('Your shelves')}<div class="pbody">${sec}<p class="small muted">Each slot earns coins from its model’s value and fills up to 60% of it. Collect here or from the Bank app.</p></div></div>`;
  });
};

/* ------------------------------------------------------- menu scene */
const FONT5 = {
  B: ['11110', '10001', '10001', '11110', '10001', '10001', '11110'], R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'],
  I: ['11111', '00100', '00100', '00100', '00100', '00100', '11111'], C: ['01111', '10000', '10000', '10000', '10000', '10000', '01111'],
  K: ['10001', '10010', '10100', '11000', '10100', '10010', '10001'], W: ['10001', '10001', '10001', '10101', '10101', '11011', '10001'],
  O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
};
function setMenuBg() {
  if (!G.menuScene) return;
  const dark = SETTINGS.theme === 'dark' || (SETTINGS.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  G.menuScene.background = new THREE.Color(dark ? '#17222C' : '#C9D9E6');
}
function buildMenuScene() {
  const S = new THREE.Scene(); G.menuScene = S;
  setMenuBg();
  S.environment = W.scene.environment;
  S.add(new THREE.HemisphereLight(0xe8f2ff, 0x6a5a48, 0.55));
  const d = new THREE.DirectionalLight(0xfff1de, 1.5); d.position.set(-20, 40, 30); d.castShadow = true; d.shadow.mapSize.set(2048, 2048);
  const sc = d.shadow.camera; sc.left = -40; sc.right = 40; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 120; d.shadow.bias = -0.0005; S.add(d);
  const word = 'BRICKWORK', cols = [C.red, C.yellow, C.blue, C.green, C.red, C.white, C.yellow, C.blue, C.red], bricks = [];
  [...word].forEach((ch, li) => FONT5[ch].forEach((row, r) => [...row].forEach((bit, c) => { if (bit === '1') bricks.push({ t: 'b1x2', c: cols[li], x: 3 + li * 6 + c, y: (6 - r) * 3, z: 4, r: 1 }); })));
  const loose = [['b2x4', C.red, 8, 0, 12, 0], ['b2x2', C.yellow, 16, 0, 13, 1], ['b1x4', C.blue, 30, 0, 12, 0], ['s2x2', C.green, 40, 0, 12, 0], ['p2x4', C.white, 47, 0, 13, 1], ['flower', C.pink, 24, 0, 14, 0], ['fig', C.blue, 35, 0, 14, 0], ['r1x1', C.orange, 2, 0, 13, 0]];
  for (const [t, c, x, y, z, r] of loose) bricks.push({ t, c, x, y, z, r });
  const g = buildModel(bricks, true); g.scale.setScalar(0.1); S.add(g);
  const bw = 60, bd = 22, base = new THREE.Mesh(new THREE.BoxGeometry(bw, 0.22, bd), MAT.base); base.position.set(0, -0.11, (bd / 2) - (bricks.reduce((a, b) => Math.max(a, b.z + 2), 0) / 2) - 2 + 2); base.receiveShadow = true;
  const bg = new THREE.Group(); bg.scale.setScalar(0.1); S.add(bg); bg.add(base);
  const sg = new THREE.CylinderGeometry(0.3, 0.3, STUD_H, 12); sg.translate(0, STUD_H / 2, 0);
  const studs = new THREE.InstancedMesh(sg, MAT.base, bw * bd); let i = 0;
  for (let x = 0; x < bw; x++) for (let z = 0; z < bd; z++) { _m4.makeTranslation(x + 0.5 - bw / 2, 0, z + 0.5 - bd / 2 + base.position.z); studs.setMatrixAt(i++, _m4); }
  studs.receiveShadow = true; bg.add(studs);
  G.menuCam = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
  G.menuT = 0;
}
function menuTick(dt) {
  G.menuT += dt;
  const a = Math.sin(G.menuT * 0.12) * 0.35, cam = G.menuCam, wide = innerWidth > 760;
  const r = wide ? 7.6 : 10.5;
  cam.position.set(Math.sin(a) * r + (wide ? -1.6 : 0), 2.6 + Math.sin(G.menuT * 0.2) * 0.15, Math.cos(a) * r);
  cam.lookAt(wide ? -1.9 : 0, 0.7, 0);
}

/* ------------------------------------------------------------ loop */
let lastT = now(), fpsN = 0, fpsT = 0, hudT = 0;
function worldTick(dt, t) {
  const tod = G.s ? G.s.time % 1440 : 14 * 60;
  updateSky(tod, PL.pos);
  W.sky.position.copy(W.camera.position); W.stars.position.copy(W.camera.position);
  for (const c of W.cars) {
    const dx = (PL.pos.x - c.g.position.x) * c.dir, blocked = dx > 0 && dx < 8 && Math.abs(PL.pos.z - c.lane) < 1.8 && G.mode === 'walk';
    c.v += ((blocked ? 0 : c.speed) - c.v) * Math.min(1, dt * (blocked ? 4 : 1.2));
    c.g.position.x += c.v * c.dir * dt;
    if (c.g.position.x > 110) c.g.position.x = -110; if (c.g.position.x < -110) c.g.position.x = 110;
  }
  for (const p of W.peds) {
    const g = p.p.g; g.position.x += p.dir * p.speed * dt;
    if (g.position.x > p.xb) p.dir = -1; else if (g.position.x < p.xa) p.dir = 1;
    g.rotation.y = p.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    const sw = Math.sin(t * 6 * p.speed + p.phase) * 0.5;
    p.p.legL.rotation.x = sw; p.p.legR.rotation.x = -sw; p.p.armL.rotation.x = -sw * 0.8; p.p.armR.rotation.x = sw * 0.8;
  }
  W.clerks.forEach((c, i) => { c.g.position.y = Math.sin(t * 1.6 + i) * 0.008; c.armR.rotation.x = Math.sin(t * 0.9 + i) * 0.08; });
  const wp = G.s && G.s.waypoint && MAP_PLACES.find(p => p[0] === G.s.waypoint);
  if (wp && G.mode === 'walk') {
    const tr = W.travel[wp[0]] || { x: wp[1], z: wp[2] }, dist = Math.hypot(tr.x - PL.pos.x, tr.z - PL.pos.z);
    W.beam.visible = true; W.beam.position.set(tr.x, 20, tr.z);
    const el = $('#waypoint'); el.hidden = false; el.textContent = `${wp[3]}, ${Math.round(dist)} m`;
    if (dist < 3.5) { G.s.waypoint = null; W.beam.visible = false; el.hidden = true; toast(`You’ve arrived at ${wp[3]}.`, 'info'); }
  } else { W.beam.visible = false; $('#waypoint').hidden = true; }
}
function frame() {
  requestAnimationFrame(frame);
  const t = now(), dt = Math.min(0.05, t - lastT); lastT = t;
  if (SETTINGS.fps) { fpsN++; fpsT += dt; if (fpsT > 0.5) { $('#fps').textContent = `${Math.round(fpsN / fpsT)} fps`; fpsN = 0; fpsT = 0; } }
  if (G.mode === 'loading') return;
  if (G.mode === 'menu') { menuTick(dt); renderer.render(G.menuScene, G.menuCam); return; }
  if (G.s && G.mode !== 'pause') careerTick(dt);
  if (G.mode === 'walk') { if (!walkCamReturnTick(dt)) walkTick(dt); UI.prompt(PL.near); }
  else if (G.mode === 'build' || (G.mode === 'ui' && UI.prev === 'build') || (G.mode === 'pause' && UI.prevPause === 'build')) {
    if (G.mode === 'build' && !G.photo) {
      const k = SETTINGS.keys; let px = 0, pz = 0;
      if (keyDown(k.left) || keyDown('ArrowLeft')) px -= 1; if (keyDown(k.right) || keyDown('ArrowRight')) px += 1;
      if (keyDown(k.fwd) || keyDown('ArrowUp')) pz -= 1; if (keyDown(k.back) || keyDown('ArrowDown')) pz += 1;
      if (px || pz) { panOrbit(-px * 420 * dt, -pz * 420 * dt); B.mouse.dirty = true; }
      if (keyDown('KeyQ')) { B.orbit.th += dt * 1.6; B.mouse.dirty = true; } if (keyDown('KeyE')) { B.orbit.th -= dt * 1.6; B.mouse.dirty = true; }
    }
    buildCamTick(dt); fallTick(dt); holoTick(t);
    if (G.mode === 'build' && B.mouse.dirty && !G.photo) { B.mouse.dirty = false; updateHover(); }
    if (B.set && G.mode === 'build') { const el = $('#setTime'); if (el) { const s = Math.floor(B.set.p.time); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; } }
  } else setCam();
  $('#touch').hidden = !(touchOn() && G.mode === 'walk');
  worldTick(dt, t);
  hudT += dt; if (hudT > 0.25) { hudT = 0; if (G.mode === 'walk' || G.mode === 'build') { UI.hud(); if (G.mode === 'walk') UI.jobs(); } }
  renderer.render(W.scene, W.camera);
}

/* ------------------------------------------------------------- boot */
function setLoad(p, txt) { const i = $('#loadI'); if (i) i.style.width = p + '%'; if (txt) $('#loadTxt').textContent = txt; }
async function boot() {
  if (!renderer) {
    $('#loading').innerHTML = '<div class="in" style="max-width:420px;text-align:center"><b>Brickwork needs WebGL</b><span class="muted">Your browser or device couldn’t start 3D graphics. Try another browser, or turn on hardware acceleration.</span></div>';
    return;
  }
  applyQuality(); initMaterials(); setLoad(12, 'Mixing colors…');
  try { await Promise.race([document.fonts.load('800 64px "Bricolage Grotesque"'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* fallback fonts */ }
  await new Promise(r => setTimeout(r, 20));
  buildWorld(); setLoad(55, 'Building the town…');
  await new Promise(r => setTimeout(r, 20));
  setupHouseInter(); setupPlate(24); applyDecor(); renderShelves();
  buildMenuScene(); setLoad(80, 'Sorting the bricks…');
  await new Promise(r => setTimeout(r, 20));
  try { renderer.compile(W.scene, W.camera); renderer.compile(G.menuScene, G.menuCam); } catch (e) { /* compile lazily */ }
  setLoad(100, 'Ready');
  $('#fps').hidden = !SETTINGS.fps;
  UI.mainMenu();
  $('#loading').style.transition = 'opacity .4s'; $('#loading').style.opacity = '0';
  setTimeout(() => $('#loading').remove(), 420);
  requestAnimationFrame(frame);
  setTimeout(() => { try { dressStoreShelves(); } catch (e) { /* decorative */ } }, 600);
  let wi = 0; const warm = () => { if (wi >= TYPES.length) return; try { ICON.part(TYPES[wi].id, C.red, 72); } catch (e) { /* skip */ } wi++; setTimeout(warm, 40); }; setTimeout(warm, 1200);
  initCaps();
}
boot();
